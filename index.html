<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Gold Pass Kostky | 3D Casino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js (3D WebGL engine) & Canvas Confetti -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #060a0f;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      user-select: none;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #FFF3B0 0%, #EAB308 50%, #CA8A04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header {
      background: rgba(12, 10, 9, 0.85);
      border-bottom: 1px solid rgba(234, 179, 8, 0.25);
      padding: 12px 20px;
      backdrop-filter: blur(8px);
    }

    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .crown-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #facc15, #d97706);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #1c1917;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.4);
    }

    .header-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: #facc15;
      letter-spacing: 0.05em;
    }

    .btn-sound {
      background: #1c1917;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #facc15;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-sound:hover {
      background: #292524;
      border-color: rgba(234, 179, 8, 0.4);
    }

    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    #outcome-banner {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .banner-idle {
      color: rgba(254, 240, 138, 0.85);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .banner-rolling {
      color: #facc15;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 0.1em;
      animation: pulse 1s infinite;
    }

    .banner-win {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      border-radius: 16px;
      background: linear-gradient(90deg, #022c22, #451a03, #022c22);
      border: 1.5px solid #facc15;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.45);
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      font-weight: 900;
    }

    .banner-loss {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 12px;
      background: rgba(69, 10, 10, 0.7);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* 3D Casino Felt Stage */
    .table-stage {
      position: relative;
      border-radius: 24px;
      border: 1px solid rgba(234, 179, 8, 0.3);
      background: 
        radial-gradient(circle at 50% 50%, rgba(20, 80, 50, 0.85) 0%, rgba(5, 25, 15, 0.95) 75%, #03140c 100%),
        radial-gradient(#145a32 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      padding: 10px;
    }

    #webgl-canvas-container {
      width: 100%;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webgl-canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      outline: none;
    }

    /* Controls Box */
    .controls-card {
      background: rgba(12, 10, 9, 0.85);
      border: 1px solid rgba(234, 179, 8, 0.25);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .controls-top {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    @media (min-width: 580px) {
      .controls-top {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .guess-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .guess-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fef08a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .guess-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #guess-input {
      width: 76px;
      padding: 8px 0;
      text-align: center;
      font-size: 1.35rem;
      font-weight: 800;
      font-family: 'Space Grotesk', monospace;
      color: #fde047;
      background: #1c1917;
      border: 1.5px solid rgba(234, 179, 8, 0.4);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    #guess-input:focus {
      border-color: #facc15;
    }

    .guess-range {
      font-size: 0.75rem;
      color: #94a3b8;
      font-family: 'Space Grotesk', monospace;
    }

    #btn-roll {
      background: linear-gradient(135deg, #facc15 0%, #eab308 50%, #ca8a04 100%);
      color: #0c0a09;
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 14px 32px;
      border-radius: 12px;
      border: 1px solid #fef08a;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.45);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #btn-roll:hover:not(:disabled) {
      transform: scale(1.04);
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.65);
    }

    #btn-roll:active:not(:disabled) {
      transform: scale(0.97);
    }

    #btn-roll:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .chips-divider {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chips-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    @media (min-width: 580px) {
      .chips-grid {
        grid-template-columns: repeat(11, 1fr);
      }
    }

    .chip-btn {
      background: #1c1917;
      border: 1px solid rgba(234, 179, 8, 0.2);
      color: #fef08a;
      font-family: 'Space Grotesk', monospace;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip-btn:hover {
      background: #292524;
      border-color: rgba(250, 204, 21, 0.5);
    }

    .chip-btn.selected {
      background: #facc15;
      color: #0c0a09;
      border-color: #fef08a;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.6);
      transform: scale(1.06);
    }

    footer {
      padding: 12px;
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      font-family: 'Space Grotesk', monospace;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo-badge">
        <div class="crown-icon">👑</div>
        <h1 class="header-title">VIP GOLD PASS KOSTKY</h1>
      </div>
      <button id="sound-btn" class="btn-sound" onclick="toggleSound()">🔊 Zvuk: Zapnuto</button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main>
    <!-- OUTCOME HEADLINE BANNER -->
    <div id="outcome-banner">
      <div class="banner-idle">Tipni číslo (2–12) a stiskni <strong style="color: #facc15;">HODIT KOSTKY</strong></div>
    </div>

    <!-- 3D CASINO FELT TABLE -->
    <div class="table-stage">
      <div id="webgl-canvas-container"></div>
    </div>

    <!-- CONTROLS -->
    <div class="controls-card">
      <div class="controls-top">

          <label class="guess-label" for="guess-input">Tvůj tip na součet:</label>
          <div class="guess-input-wrap">

            <span class="guess-range">(2–12)</span>
          </div>

          <span>🎲 HODIT KOSTKY</span>

  <!-- FOOTER -->
  <footer>
    VIP Gold Pass Kostky • Jediný samostatný HTML soubor pro GitHub
  </footer>

  <!-- PROCEDURAL SOUND & 3D WEBGL ENGINE -->
  <script>
    // -------------------------------------------------------------------------
    // 1. PROCEDURAL WEB AUDIO SYNTHESIZER
    // -------------------------------------------------------------------------
    let soundEnabled = true;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').textContent = soundEnabled ? '🔊 Zvuk: Zapnuto' : '🔇 Zvuk: Vypnuto';
      if (soundEnabled) playChipSelect();
    }

    function playChipSelect() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(850, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.07);
    }

    function playDiceShake() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      for (let i = 0; i < 4; i++) {
        const t = ctx.currentTime + i * 0.06;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(220 + Math.random() * 80, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.04);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.045);
      }
    }

    function playAerialWhoosh() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const bufSize = ctx.sampleRate * 0.7;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(400, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 0.35);
      filter.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.7);
      filter.Q.value = 3;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.01, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 0.25);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start();
      noise.stop(ctx.currentTime + 0.7);
    }

    function playDiceLanding() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      [0, 0.07, 0.16].forEach((delay, idx) => {
        const t = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160 - idx * 25, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.05);
        gain.gain.setValueAtTime(0.2 / (idx + 1), t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.055);
      });
    }

    function playJackpotWin() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        const t = ctx.currentTime + i * 0.15;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + (i === 3 ? 0.9 : 0.2));
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + (i === 3 ? 0.9 : 0.2));
      });
    }

    function playPenaltyBuzz() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(80, ctx.currentTime + 0.45);
      gain.gain.setValueAtTime(0.16, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.48);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    }

    // -------------------------------------------------------------------------
    // 2. PROCEDURAL 3D GOLD TEXTURES FOR CUBE MESH
    // -------------------------------------------------------------------------
    function createDiceTexture(num) {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Metallic Gold Radial Gradient
      const grad = ctx.createRadialGradient(size/2, size/2, 50, size/2, size/2, size * 0.7);
      grad.addColorStop(0, '#FFE875');
      grad.addColorStop(0.45, '#EAB308');
      grad.addColorStop(0.85, '#CA8A04');
      grad.addColorStop(1, '#854D0E');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      // Gold Metallic Edge Inset
      ctx.strokeStyle = '#FEF08A';
      ctx.lineWidth = 14;
      ctx.strokeRect(10, 10, size - 20, size - 20);

      ctx.strokeStyle = '#713F12';
      ctx.lineWidth = 8;
      ctx.strokeRect(20, 20, size - 40, size - 40);

      // Pips
      const pipRadius = 38;
      const pipsCoords = {
        1: [[256, 256]],
        2: [[130, 130], [382, 382]],
        3: [[130, 130], [256, 256], [382, 382]],
        4: [[130, 130], [382, 130], [130, 382], [382, 382]],
        5: [[130, 130], [382, 130], [256, 256], [130, 382], [382, 382]],
        6: [[130, 120], [382, 120], [130, 256], [382, 256], [130, 392], [382, 392]],
      };

      (pipsCoords[num] || pipsCoords[1]).forEach(([px, py]) => {
        // Pip carved outer rim
        ctx.beginPath();
        ctx.arc(px, py, pipRadius + 4, 0, Math.PI * 2);
        ctx.fillStyle = '#713F12';
        ctx.fill();

        // Inset dark cavity
        const pipGrad = ctx.createRadialGradient(px - 4, py - 4, 4, px, py, pipRadius);
        pipGrad.addColorStop(0, '#292524');
        pipGrad.addColorStop(0.8, '#0c0a09');
        pipGrad.addColorStop(1, '#000000');
        ctx.beginPath();
        ctx.arc(px, py, pipRadius, 0, Math.PI * 2);
        ctx.fillStyle = pipGrad;
        ctx.fill();

        // Highlight shine
        ctx.beginPath();
        ctx.arc(px - 10, py - 10, pipRadius * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fill();
      });

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    // Target Orientations for Numbers 1 to 6
    const TARGET_ANGLES = {
      1: { x: -Math.PI / 4, y: 0, z: 0 },
      6: { x: Math.PI * 0.75, y: 0, z: 0 },
      2: { x: 0, y: -Math.PI / 2 + 0.25, z: 0.15 },
      5: { x: 0, y: Math.PI / 2 - 0.25, z: -0.15 },
      3: { x: -0.2, y: 0, z: 0 },
      4: { x: -0.2, y: Math.PI, z: 0 },
    };

    // -------------------------------------------------------------------------
    // 3. THREE.JS 3D SCENE SETUP
    // -------------------------------------------------------------------------
    const container = document.getElementById('webgl-canvas-container');
    const scene = new THREE.Scene();

    const width = container.clientWidth || 600;
    const height = container.clientHeight || 260;
    const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
    camera.position.set(0, 3.2, 7.8);
    camera.lookAt(0, 0.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Studio Lights
    const ambientLight = new THREE.AmbientLight(0xfff6d0, 1.4);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.2);
    dirLight1.position.set(4, 8, 6);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xfef08a, 1.3);
    dirLight2.position.set(-6, 4, 3);
    scene.add(dirLight2);

    const pointLight = new THREE.PointLight(0xffd700, 1.5, 15);
    pointLight.position.set(0, 4, 2);
    scene.add(pointLight);

    // Box Materials
    const materials = [
      new THREE.MeshStandardMaterial({ map: createDiceTexture(2), roughness: 0.22, metalness: 0.8 }),
      new THREE.MeshStandardMaterial({ map: createDiceTexture(5), roughness: 0.22, metalness: 0.8 }),
      new THREE.MeshStandardMaterial({ map: createDiceTexture(1), roughness: 0.22, metalness: 0.8 }),
      new THREE.MeshStandardMaterial({ map: createDiceTexture(6), roughness: 0.22, metalness: 0.8 }),
      new THREE.MeshStandardMaterial({ map: createDiceTexture(3), roughness: 0.22, metalness: 0.8 }),
      new THREE.MeshStandardMaterial({ map: createDiceTexture(4), roughness: 0.22, metalness: 0.8 }),
    ];

    const geometry = new THREE.BoxGeometry(1.7, 1.7, 1.7);

    // Die 1
    const die1 = new THREE.Mesh(geometry, materials);
    die1.position.set(-1.8, 0, 0);
    const initT1 = TARGET_ANGLES[3];
    die1.rotation.set(initT1.x, initT1.y, initT1.z);
    scene.add(die1);

    // Die 2
    const die2 = new THREE.Mesh(geometry, materials);
    die2.position.set(1.8, 0, 0);
    const initT2 = TARGET_ANGLES[4];
    die2.rotation.set(initT2.x, initT2.y, initT2.z);
    scene.add(die2);

    // -------------------------------------------------------------------------
    // 4. FLIGHT & ROTATION ANIMATION CONTROLLER
    // -------------------------------------------------------------------------
    const animState = {
      isAnimating: false,
      startTime: 0,
      duration: 2200,
      startRot1: { x: 0, y: 0, z: 0 },
      startRot2: { x: 0, y: 0, z: 0 },
      targetRot1: { x: 0, y: 0, z: 0 },
      targetRot2: { x: 0, y: 0, z: 0 },
    };

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      if (animState.isAnimating) {
        const now = performance.now();
        const elapsed = now - animState.startTime;
        const progress = Math.min(1, elapsed / animState.duration);

        // Smooth elevation in Y (up and down)
        let heightProgress = 0;
        if (progress < 0.45) {
          const p = progress / 0.45;
          heightProgress = Math.sin(p * Math.PI * 0.5);
        } else {
          const p = (progress - 0.45) / 0.55;
          heightProgress = Math.cos(p * Math.PI * 0.5);
        }

        const currentY = Math.max(0, heightProgress * 2.5);
        die1.position.y = currentY;
        die2.position.y = currentY;

        // Smooth rotational cubic easing
        const rotEase = 1 - Math.pow(1 - progress, 2.5);

        die1.rotation.x = animState.startRot1.x + (animState.targetRot1.x - animState.startRot1.x) * rotEase;
        die1.rotation.y = animState.startRot1.y + (animState.targetRot1.y - animState.startRot1.y) * rotEase;
        die1.rotation.z = animState.startRot1.z + (animState.targetRot1.z - animState.startRot1.z) * rotEase;

        die2.rotation.x = animState.startRot2.x + (animState.targetRot2.x - animState.startRot2.x) * rotEase;
        die2.rotation.y = animState.startRot2.y + (animState.targetRot2.y - animState.startRot2.y) * rotEase;
        die2.rotation.z = animState.startRot2.z + (animState.targetRot2.z - animState.startRot2.z) * rotEase;

        if (progress >= 1) {
          animState.isAnimating = false;
          die1.position.y = 0;
          die2.position.y = 0;
        }
      }

      renderer.render(scene, camera);
    }
    renderLoop();

    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight || 260;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // -------------------------------------------------------------------------
    // 5. GAME LOGIC & UI INTERACTION
    // -------------------------------------------------------------------------
    let currentGuess = 7;
    let isRolling = false;

    // Render 2 - 12 Chip Buttons
    const chipsContainer = document.getElementById('chips-container');
    for (let i = 2; i <= 12; i++) {
      const btn = document.createElement('button');
      btn.className = 'chip-btn' + (i === currentGuess ? ' selected' : '');
      btn.id = 'chip-' + i;
      btn.textContent = i;
      btn.onclick = () => selectGuess(i);
      chipsContainer.appendChild(btn);
    }

    function selectGuess(val) {
      if (isRolling) return;
      currentGuess = Math.max(2, Math.min(12, val));
      document.getElementById('guess-input').value = currentGuess;
      updateSelectedChip();
      playChipSelect();
    }

    function onInputChange(val) {
      selectGuess(parseInt(val, 10) || 2);
    }

    function updateSelectedChip() {
      for (let i = 2; i <= 12; i++) {
        const btn = document.getElementById('chip-' + i);
        if (btn) {
          if (i === currentGuess) btn.classList.add('selected');
          else btn.classList.remove('selected');
        }
      }
    }

    function rollDice() {
      if (isRolling) return;
      isRolling = true;
      document.getElementById('btn-roll').disabled = true;

      // Banner update
      const banner = document.getElementById('outcome-banner');
      banner.innerHTML = '<div class="banner-rolling">KOSTKY LETÍ A POMALU SE TOČÍ VE VZDUCHU... ✨</div>';

      // Pick roll values (1 to 6)
      const val1 = Math.floor(Math.random() * 6) + 1;
      const val2 = Math.floor(Math.random() * 6) + 1;
      const sum = val1 + val2;
      const won = sum === currentGuess;

      const baseT1 = TARGET_ANGLES[val1];
      const baseT2 = TARGET_ANGLES[val2];

      const cur1 = die1.rotation;
      const cur2 = die2.rotation;

      // Start flight animation
      animState.startTime = performance.now();
      animState.isAnimating = true;
      animState.startRot1 = { x: cur1.x, y: cur1.y, z: cur1.z };
      animState.startRot2 = { x: cur2.x, y: cur2.y, z: cur2.z };
      animState.targetRot1 = {
        x: cur1.x + Math.PI * 4 + (baseT1.x - (cur1.x % (Math.PI * 2))),
        y: cur1.y + Math.PI * 4 + (baseT1.y - (cur1.y % (Math.PI * 2))),
        z: cur1.z + Math.PI * 2 + (baseT1.z - (cur1.z % (Math.PI * 2))),
      };
      animState.targetRot2 = {
        x: cur2.x + Math.PI * 4 + (baseT2.x - (cur2.x % (Math.PI * 2))),
        y: cur2.y - Math.PI * 4 + (baseT2.y - (cur2.y % (Math.PI * 2))),
        z: cur2.z - Math.PI * 2 + (baseT2.z - (cur2.z % (Math.PI * 2))),
      };

      // Sounds
      playDiceShake();
      setTimeout(playAerialWhoosh, 200);
      setTimeout(playDiceLanding, 1900);

      // Finish outcome at 2200ms
      setTimeout(() => {
        isRolling = false;
        document.getElementById('btn-roll').disabled = false;

        if (won) {
          playJackpotWin();
          if (window.confetti) {
            confetti({
              particleCount: 110,
              spread: 80,
              origin: { y: 0.6 },
              colors: ['#ffd700', '#f59e0b', '#ffffff'],
            });
          }
          banner.innerHTML = `<div class="banner-win">
            <span>👑</span>
            <span class="gold-gradient-text">VYHRÁL JSI! PADLO PŘESNĚ ${sum}!</span>
            <span>🎉</span>
          </div>`;
        } else {
          playPenaltyBuzz();
          banner.innerHTML = `<div class="banner-loss">
            <span>❌</span>
            <span>Netrefil ses! Padlo <strong style="color: #fde047;">${sum}</strong> (tvůj tip byl ${currentGuess}). Zkus to znovu!</span>
          </div>`;
        }
      }, 2200);
    }
  </script>
</body>
</html>
